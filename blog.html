<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>승주의 일기장</title>
<meta name="description" content="박승주의 블로그 · 배운 것, 프로젝트 회고, AI 활용 팁">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<style>
:root{--ink:#5A4632;--sub:#7E6A55;--paper:#FFFDF6;--cream:#FFF9EC;--line:#EADFC8;--wood:#C08E5B;--wood2:#9F6F42;--teal:#5DBFB2;--orange:#F29B4B}
*{box-sizing:border-box}
body{margin:0;color:var(--sub);font-family:'Noto Sans KR',sans-serif;font-size:16px;line-height:1.8;word-break:keep-all;background:#9DD27F;background-image:radial-gradient(#B3DE97 2.2px,transparent 2.6px),radial-gradient(#B3DE97 2.2px,transparent 2.6px);background-size:46px 46px;background-position:0 0,23px 23px;padding:24px 16px 60px}
a{color:var(--teal)}
.wrap{max-width:820px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.title{background:var(--wood);color:#FFF6E4;font-family:'Jua',sans-serif;font-size:26px;padding:8px 24px;border-radius:16px;box-shadow:0 5px 0 var(--wood2);text-decoration:none}
.back{background:var(--paper);color:var(--ink);font-family:'Jua',sans-serif;padding:7px 16px;border-radius:999px;box-shadow:0 4px 0 var(--line);text-decoration:none}
.card{background:var(--paper);border-radius:28px;padding:26px 28px;box-shadow:0 6px 0 var(--line),0 14px 24px rgba(90,70,50,.18);margin-bottom:18px}
.post{display:block;text-decoration:none;color:inherit;transition:transform .15s}
.post:hover{transform:translateY(-3px)}
.post h2{font-family:'Jua',sans-serif;font-weight:400;color:var(--ink);font-size:23px;margin:2px 0 4px}
.meta{font-size:13px;color:var(--orange);font-weight:700}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.tag{font:inherit;font-size:13px;padding:4px 12px;border-radius:999px;border:2px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.tag.on{background:var(--teal);border-color:var(--teal);color:#fff}
article.body h1{font-family:'Jua',sans-serif;font-weight:400;color:var(--ink);font-size:30px;line-height:1.3;margin:6px 0 16px}
article.body h2,article.body h3{font-family:'Jua',sans-serif;font-weight:400;color:var(--ink);margin:26px 0 8px}
article.body img{max-width:100%;border-radius:16px}
article.body blockquote{margin:16px 0;padding:10px 18px;background:var(--cream);border-left:4px solid var(--teal);border-radius:0 14px 14px 0}
article.body code{background:var(--cream);padding:1px 6px;border-radius:6px}
article.body pre{background:#2E2A33;color:#F6EBD9;padding:14px;border-radius:14px;overflow:auto}
article.body pre code{background:none;padding:0}
.empty{text-align:center}
</style>
<link rel="stylesheet" href="assets/css/reading.css">
</head>
<body class="journal">
<div class="wrap">
  <header><a class="title" href="blog.html">📔 승주의 일기장</a><a class="back" href="index.html">🌴 섬으로 돌아가기</a></header>
  <main id="app"><div class="card">불러오는 중…</div></main>
</div>
<script>
(function(){
var app=document.getElementById('app');
function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var q=new URLSearchParams(location.search),pid=q.get('p'),tag=q.get('tag');
fetch('posts/posts.json',{cache:'no-store'}).then(function(r){return r.json()}).then(function(ps){
  ps.sort(function(a,b){return b.date.localeCompare(a.date)});
  if(pid){var p=ps.filter(function(x){return x.id===pid})[0];if(!p){app.innerHTML='<div class="card empty">글을 찾을 수 없어요.</div>';return}
    document.title=p.title+' · 승주의 일기장';
    fetch('posts/'+p.file,{cache:'no-store'}).then(function(r){return r.text()}).then(function(md){
      app.innerHTML='<div class="card"><div class="meta">'+esc(p.date)+(p.tags?' · '+p.tags.map(esc).join(' · '):'')+'</div><article class="body">'+(window.marked?marked.parse(md):'<pre>'+esc(md)+'</pre>')+'</article><p style="margin-top:24px"><a href="blog.html">← 목록으로</a></p></div>'})
    return}
  var tags={};ps.forEach(function(p){(p.tags||[]).forEach(function(t){tags[t]=1})});
  var list=tag?ps.filter(function(p){return (p.tags||[]).indexOf(tag)>=0}):ps;
  app.innerHTML='<div class="tags"><a class="tag'+(tag?'':' on')+'" href="blog.html">전체</a>'+Object.keys(tags).map(function(t){return '<a class="tag'+(t===tag?' on':'')+'" href="blog.html?tag='+encodeURIComponent(t)+'">'+esc(t)+'</a>'}).join('')+'</div>'+
    (list.map(function(p){return '<a class="card post" href="blog.html?p='+encodeURIComponent(p.id)+'"><div class="meta">'+esc(p.date)+(p.tags?' · '+p.tags.map(esc).join(' · '):'')+'</div><h2>'+esc(p.title)+'</h2><p style="margin:0">'+esc(p.summary)+'</p></a>'}).join('')||'<div class="card empty">아직 글이 없어요.</div>');
}).catch(function(){app.innerHTML='<div class="card empty">일기장은 웹(GitHub Pages)에 올린 뒤에 열려요.<br>내 컴퓨터에서 파일로 열면 글 목록을 불러올 수 없어요.</div>'});
})();
</script>
</body>
</html>
