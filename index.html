<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>주섬주섬 · 박승주 포트폴리오</title>
<meta name="description" content="한옥과 텃밭을 산책하며 프로젝트와 경험을 둘러보는 박승주의 게임형 포트폴리오, 주섬주섬.">
<link rel="canonical" href="https://zoe3399.github.io/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="주섬주섬">
<meta property="og:title" content="주섬주섬 · 박승주 포트폴리오">
<meta property="og:description" content="한옥과 텃밭을 산책하며 프로젝트와 경험을 둘러보는 게임형 포트폴리오">
<meta property="og:url" content="https://zoe3399.github.io/">
<meta property="og:image" content="https://zoe3399.github.io/assets/img/social/main-screen-og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="540">
<meta property="og:image:alt" content="한옥 마루와 앉아 있는 캐릭터, 로고가 보이는 주섬주섬 메인 화면">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* card styles from list view */
:root{
  --sky1:#BFE7F7; --sky2:#E9F7FB; --grass:#9DD27F; --grass2:#8BC66C; --grass-dot:#B3DE97;
  --cream:#FFF9EC; --paper:#FFFDF6; --ink:#5A4632; --sub:#7E6A55; --line:#EADFC8;
  --wood:#C08E5B; --wood2:#9F6F42; --wood-ink:#FFF6E4;
  --orange:#F29B4B; --teal:#5DBFB2; --pink:#F4A6B8; --yellow:#FFD66B; --blue:#79B8E8;
  --shadow:rgba(90,70,50,.18); --btn-ink:#FFFFFF; --bg:#9DD27F;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky1:#1B2A4A; --sky2:#2C3F66; --grass:#3F6B45; --grass2:#35603B; --grass-dot:#4A7A50;
    --cream:#2E2A33; --paper:#34303A; --ink:#F6EBD9; --sub:#CDBFA9; --line:#4A4450;
    --wood:#8A643F; --wood2:#6E4E30; --wood-ink:#FFF2DA;
    --shadow:rgba(0,0,0,.35); --btn-ink:#1E1A22; --bg:#3F6B45;
  }
}
:root[data-theme="dark"]{
  --sky1:#1B2A4A; --sky2:#2C3F66; --grass:#3F6B45; --grass2:#35603B; --grass-dot:#4A7A50;
  --cream:#2E2A33; --paper:#34303A; --ink:#F6EBD9; --sub:#CDBFA9; --line:#4A4450;
  --wood:#8A643F; --wood2:#6E4E30; --wood-ink:#FFF2DA;
  --shadow:rgba(0,0,0,.35); --btn-ink:#1E1A22; --bg:#3F6B45;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:20px}
body{margin:0;color:var(--sub);font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:15px;line-height:1.75;word-break:keep-all;-webkit-font-smoothing:antialiased;
  background-color:var(--grass);
  background-image:radial-gradient(var(--grass-dot) 2.2px,transparent 2.6px),radial-gradient(var(--grass-dot) 2.2px,transparent 2.6px);
  background-size:46px 46px;background-position:0 0,23px 23px;padding-bottom:96px}
a{color:var(--teal);text-decoration:none;font-weight:500}
a:hover{text-decoration:underline}
strong{color:var(--ink)}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
.round{font-family:'Jua','Noto Sans KR',sans-serif;font-weight:400}

/* ---------- sky hero ---------- */
header.hero{position:relative;background:linear-gradient(var(--sky1),var(--sky2) 78%);padding:40px 0 0;overflow:hidden}
.scene{position:relative;height:300px;max-width:1040px;margin:0 auto}
.scene svg{position:absolute;inset:0;width:100%;height:100%}
.cloud{animation:drift 26s linear infinite}
.cloud.c2{animation-duration:38s;animation-delay:-12s}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(1160px)}}
.sign{position:absolute;left:50%;bottom:58px;transform:translateX(-50%);text-align:center}
.sign .board{background:var(--wood);color:var(--wood-ink);border-radius:18px;padding:14px 34px 12px;box-shadow:0 6px 0 var(--wood2),0 12px 18px var(--shadow);position:relative}
.sign .board:before{content:'';position:absolute;inset:6px;border:2px dashed rgba(255,246,228,.45);border-radius:13px;pointer-events:none}
.sign h1{margin:0;font-size:44px;line-height:1.1;letter-spacing:.02em;white-space:nowrap}
.sign .sub{white-space:nowrap}
.sign .sub{font-size:14px;opacity:.92;margin-top:4px}
.sign .post{width:16px;height:64px;margin:0 auto;background:var(--wood2);border-radius:0 0 6px 6px}
.ground{height:44px;background:var(--grass);border-radius:50% 50% 0 0/100% 100% 0 0;margin-top:-30px;position:relative}

/* ---------- dialog box ---------- */
.dialog-wrap{margin:-6px auto 0;position:relative;z-index:2}
.dialog{position:relative;background:var(--cream);border-radius:40px;padding:34px 40px 30px;box-shadow:0 8px 0 var(--line),0 16px 30px var(--shadow)}
.nametag{position:absolute;top:-18px;left:40px;background:var(--orange);color:#fff;padding:4px 20px;border-radius:999px;font-size:17px;transform:rotate(-3deg);box-shadow:0 3px 0 #D9803A}
.dialog .line{white-space:pre-line;font-size:18px;color:var(--ink);min-height:3.6em;margin:0}
.dialog .next{position:absolute;right:36px;bottom:14px;color:var(--orange);font-size:18px;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(4px)}}
.dialog .choices{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:999px;background:var(--paper);color:var(--ink);font-size:14px;font-weight:700;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);transition:transform .15s}
.btn:hover{transform:translateY(-2px);text-decoration:none}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff;box-shadow:0 3px 0 #469C91}

/* ---------- achievement badges ---------- */
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:26px 0 0}
.stat{background:var(--paper);border-radius:24px;padding:16px 14px 14px;text-align:center;box-shadow:0 5px 0 var(--line);position:relative}
.stat .medal{width:40px;height:40px;border-radius:50%;margin:-34px auto 6px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.stat em{display:block;font-style:normal;font-size:12.5px;font-weight:700;color:var(--orange);letter-spacing:.04em;margin-bottom:2px}
.nw{white-space:nowrap}
@media (max-width:560px){.stat span{font-size:12px}}
.stat b{display:block;font-size:24px;color:var(--ink);line-height:1.25}
.stat span{font-size:13px}

/* ---------- sections as places ---------- */
section{padding:56px 0 8px}
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:26px}
h2{margin:0;display:inline-flex;align-items:center;gap:12px;background:var(--wood);color:var(--wood-ink);padding:10px 26px 9px;border-radius:16px;font-size:24px;font-weight:400;box-shadow:0 5px 0 var(--wood2);position:relative}
h2 .n{background:var(--wood-ink);color:var(--wood2);border-radius:999px;font-size:13px;padding:1px 10px;font-family:'Noto Sans KR',sans-serif;font-weight:700}
h2 .place{font-size:14px;opacity:.85;font-family:'Noto Sans KR',sans-serif}
.sh p{margin:0;background:var(--paper);color:var(--sub);font-size:13.5px;padding:6px 14px;border-radius:999px;box-shadow:0 3px 0 var(--line)}

/* paper cards */
.card,.wc,.pc,.oc,.skills-card{background:var(--paper);border-radius:28px;box-shadow:0 6px 0 var(--line),0 14px 24px var(--shadow);position:relative}
.wc:hover,.pc:hover,.oc:hover{transform:translateY(-3px)}
.wc,.pc,.oc{transition:transform .2s}

.work{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
.wc{padding:26px 26px 20px;display:flex;flex-direction:column}
.wc.span2{grid-column:1/-1}
.wc h3,.pc h3,.oc h3{font-family:'Jua','Noto Sans KR',sans-serif;font-weight:400;color:var(--ink);margin:0 0 2px;font-size:21px;line-height:1.35}
.wc .meta{font-size:13px;color:var(--orange);font-weight:700;margin-bottom:12px}
.pr{display:grid;grid-template-columns:58px 1fr;gap:6px 10px;margin:0;font-size:14.5px}
.pr dt{color:#fff;font-weight:700;font-size:12px;border-radius:999px;text-align:center;height:22px;line-height:22px;margin-top:3px}
.pr dt:nth-of-type(1){background:var(--pink)}
.pr dt:nth-of-type(2){background:var(--blue)}
.pr dt:nth-of-type(3){background:var(--teal)}
.pr dd{margin:0}
.wc .foot{margin-top:auto;padding-top:16px;display:flex;gap:8px;flex-wrap:wrap}
.tag{display:inline-block;font-size:12px;padding:3px 11px;border-radius:999px;background:var(--cream);color:var(--sub);border:1.5px solid var(--line)}
.tag.lock{background:#FFF1D6;color:#B07A24;border-color:#F3D9A8}
:root[data-theme="dark"] .tag.lock{background:#3A3122;color:#E8C27A;border-color:#5A4A30}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag.lock{background:#3A3122;color:#E8C27A;border-color:#5A4A30}}

.appgrid{display:grid;grid-template-columns:1fr 1.25fr;gap:24px;align-items:start}
.appgrid.vert{grid-template-columns:1fr;gap:18px}
.shots{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.shots figure,.vids figure{margin:0}
.shots img{display:block;width:100%;aspect-ratio:9/19.5;object-fit:cover;object-position:top;border-radius:18px;border:4px solid var(--ink);background:var(--cream)}
.shots figcaption,.vids figcaption{font-size:12px;text-align:center;margin-top:6px}
.vids{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.vids video{display:block;width:100%;aspect-ratio:16/11;object-fit:contain;border-radius:18px;background:#1E1A22;border:4px solid var(--wood)}

.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.gallery figure{margin:0}
.gallery img,.gallery video{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:14px;background:#111;border:1px solid var(--line)}
.gallery figcaption{font-size:12px;text-align:center;margin-top:5px}
@media (max-width:560px){.gallery{grid-template-columns:1fr}}
.proposal-teaser{margin:18px 0 0;background:#f1eff0;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.proposal-teaser img{display:block;width:100%;height:auto;max-height:235px;object-fit:cover;object-position:center}
.proposal-teaser figcaption{padding:8px 12px;font-size:12px;text-align:center;color:var(--sub)}
.proposal-gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:12px 0 0}
.proposal-gallery figure{margin:0;background:#f1eff0;border:1px solid var(--line);border-radius:13px;overflow:hidden}
.proposal-gallery img{display:block;width:100%;aspect-ratio:1.42;object-fit:cover}
.proposal-gallery figcaption{padding:8px 6px;font-size:12px;text-align:center;color:var(--sub)}
@media (max-width:640px){.proposal-gallery{grid-template-columns:1fr}.proposal-gallery img{aspect-ratio:1.7}}
.private-case{margin:18px 0 0;padding:16px;background:#f8f4ee;border:1px solid var(--line);border-radius:16px}.private-case h4{margin:0;color:#5a4632;font-size:17px}.private-case p{margin:7px 0 0;color:var(--sub);font-size:13px;line-height:1.65}.private-case small{display:block;margin-top:9px;color:var(--sub);font-size:11px;text-align:center}
.phones{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.phones figure{margin:0}
.phones img{display:block;width:100%;height:auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.15))}
.phones figcaption{font-size:12px;text-align:center;margin-top:4px}
@media (max-width:560px){.phones{grid-template-columns:repeat(2,1fr)}}
.pc-media{grid-column:1/-1;padding:0 26px 24px}
.pc-media .gallery{margin-top:0}
.oc.span2{grid-column:1/-1}
.oc.plan{flex-direction:column;gap:14px}
.oc.plan:before{background:var(--blue)}
.oc.plan .top{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.oc.plan .when{font-size:13px;margin-bottom:8px}
.oc.plan .pr{margin:6px 0 4px}
.diagrams{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.diagrams figure{margin:0}
.diagrams .wide2{grid-column:1/-1}
.oc .diagrams img{display:block;width:100%;height:auto;object-fit:contain;flex:none;background:#fff;border-radius:14px;border:1px solid var(--line);padding:8px}
.diagrams figcaption{font-size:12px;text-align:center;margin-top:5px}
@media (max-width:560px){.diagrams{grid-template-columns:1fr}}
.pivot{font-size:14px;margin:0 0 10px}
.ptools{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:-8px 0 18px}
.ptools .chips,.ptools .tright{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{font:inherit;font-size:13.5px;font-weight:700;cursor:pointer;padding:7px 15px;border-radius:999px;border:2px solid var(--line);background:var(--paper,#fff);color:var(--ink);transition:transform .15s}
.chip b{font-size:12px;opacity:.7;margin-left:3px}
.chip:hover{transform:translateY(-1px)}
.chip.on{background:var(--teal,var(--accent));border-color:var(--teal,var(--accent));color:#fff}
.sel select{font:inherit;font-size:13.5px;font-weight:700;padding:7px 12px;border-radius:999px;border:2px solid var(--line);background:var(--paper,#fff);color:var(--ink);cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.gist{margin:2px 0 10px!important;color:var(--ink);font-weight:500}
.more-btn{font:inherit;font-size:13px;font-weight:700;cursor:pointer;background:none;border:none;color:var(--teal,var(--accent));padding:0;margin-bottom:4px}
.more-btn span{display:inline-block;transition:transform .2s}
.pc.open .more-btn span{transform:rotate(180deg)}
html.js .pc:not(.open) .more{display:none}
html.js .pc:not(.open) .thumb{min-height:120px}
html.js .pc:not(.open){grid-template-columns:200px 1fr}
.pc.hide{display:none}
@media (max-width:860px){html.js .pc:not(.open){grid-template-columns:1fr}html.js .pc:not(.open) .thumb{min-height:110px;aspect-ratio:16/6}}
.awards .alist{list-style:none;margin:8px 0 0;padding:0}
.awards .alist li{display:grid;grid-template-columns:56px 1fr;gap:10px;padding:10px 0;border-bottom:1.5px dashed var(--line);font-size:14.5px}
.awards .alist li:last-child{border-bottom:none}
.awards .ay{font-weight:700;color:var(--ink)}
.awards .ao{font-size:12.5px;color:var(--sub);margin-left:4px}
.awards .ap{font-size:13px}
.awards:before{background:var(--yellow)!important}
html.js .fold:not(.open) .more{display:none}
html.js .oc.fold:not(.open) img{height:90px;width:80px}
.fold.open .more-btn span{transform:rotate(180deg)}
/* projects = exploration log */
.projects{display:grid;gap:24px}
.pc{display:grid;grid-template-columns:290px 1fr;overflow:hidden}
.pc .thumb{position:relative;min-height:220px;background:var(--cream);margin:14px;border-radius:20px;overflow:hidden;border:3px dashed var(--line)}
.pc .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top center}
.pc .thumb img.wide{object-fit:contain;object-position:center;padding:12px}
.pc .body{padding:22px 26px 22px 10px}
.pc .top{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.award{font-size:12px;font-weight:700;padding:3px 12px;border-radius:999px;background:var(--yellow);color:#7A5410}
.award:before{content:'★ '}
.role{font-size:12px;font-weight:700;padding:3px 12px;border-radius:999px;background:var(--cream);color:var(--orange);border:1.5px solid #F7CFA6}
.pc .when{font-size:13px;margin-bottom:10px}
.pc p{margin:0 0 10px;font-size:14.5px}
.metric{display:inline-block;font-weight:700;color:var(--ink);background:var(--yellow);padding:0 9px;border-radius:999px;font-size:14px}
:root[data-theme="dark"] .metric{color:#3A2A10}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .metric{color:#3A2A10}}
.use{background:var(--cream);border-radius:18px;padding:10px 16px;font-size:14px;margin:12px 0;border:2px dashed var(--line)}
.use b{color:var(--teal);margin-right:6px}
.stack{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{font-size:13px;padding:6px 14px;border-radius:999px;background:var(--teal);color:#fff;font-weight:700;box-shadow:0 3px 0 #469C91;transition:transform .15s}
.links a:hover{text-decoration:none;transform:translateY(-2px)}

/* bulletin board */
.others{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
.oc{display:flex;gap:16px;padding:18px}
.oc:before{content:'';position:absolute;top:-8px;left:50%;width:16px;height:16px;border-radius:50%;background:var(--pink);box-shadow:0 2px 0 rgba(0,0,0,.15);transform:translateX(-50%)}
.oc img{width:108px;height:140px;object-fit:cover;object-position:top;border-radius:14px;flex:none;background:var(--cream)}
.oc h3{font-size:18px;margin-bottom:4px}
.oc p{font-size:14px;margin:0 0 10px}

/* theater */
.video{display:grid;grid-template-columns:1.3fr 1fr;gap:26px;align-items:center;background:var(--paper);border-radius:28px;padding:22px;box-shadow:0 6px 0 var(--line),0 14px 24px var(--shadow)}
.video figure{margin:0;border-radius:20px;overflow:hidden;position:relative;border:5px solid var(--wood)}
.video img,.video video{display:block;width:100%;height:auto}
.video .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.video .play span{background:var(--orange);color:#fff;border-radius:999px;padding:10px 20px;font-weight:700;font-size:15px;box-shadow:0 4px 0 #D9803A}
.video h3{font-family:'Jua','Noto Sans KR',sans-serif;font-weight:400;font-size:22px;color:var(--ink);margin:0 0 8px}

/* tool box */
.skills-card{padding:10px 18px}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{text-align:left;padding:12px 10px;border-bottom:2px dashed var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
th{color:var(--ink);font-weight:700}
td:first-child{white-space:nowrap;width:150px}
td:first-child span{display:inline-block;background:var(--cream);color:var(--ink);font-weight:700;padding:2px 12px;border-radius:999px;border:1.5px solid var(--line)}

footer{padding:40px 0 20px;font-size:13px;color:var(--ink)}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;background:var(--paper);border-radius:999px;padding:12px 26px;box-shadow:0 4px 0 var(--line)}

/* ---------- dock (menu) ---------- */
.dock{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:20;display:flex;gap:8px;background:var(--cream);padding:8px 10px;border-radius:26px;box-shadow:0 6px 0 var(--line),0 12px 24px var(--shadow);max-width:calc(100vw - 24px)}
.dock a{white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:2px;width:68px;padding:6px 2px 4px;border-radius:18px;color:var(--ink);font-size:11.5px;font-weight:700;transition:transform .15s}
.dock a:hover{transform:translateY(-4px);text-decoration:none}
.dock i{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.dock i svg{width:22px;height:22px;fill:#fff}
.theme-toggle{position:absolute;top:14px;right:16px;z-index:3;background:var(--paper);color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:5px 14px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.stars{display:none}
:root[data-theme="dark"] .stars{display:block}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .stars{display:block}}
:root[data-theme="dark"] .sun{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sun{display:none}}
.moon{display:none}
:root[data-theme="dark"] .moon{display:block}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .moon{display:block}}

@media (max-width:860px){
  .badges{grid-template-columns:repeat(2,1fr);row-gap:30px}
  .work,.others{grid-template-columns:1fr}
  .pc{grid-template-columns:1fr}
  .pc .thumb{min-height:170px;aspect-ratio:16/8}
  .pc .body{padding:4px 22px 22px}
  .appgrid{grid-template-columns:1fr}
  .shots{grid-template-columns:repeat(2,1fr)}
  .video{grid-template-columns:1fr}
  .sign h1{font-size:34px}
  .scene{height:250px}
